title: Varmeoptimering
icon: mdi:heat-wave
views:
  - title: Overblik
    path: varmeoptimering
    icon: mdi:view-dashboard
    type: masonry
    badges:
      - entity: sensor.varme_status
        name: Status
      - entity: binary_sensor.varme_alarm_aktiv
        name: Alarm
      - entity: sensor.varme_drift_score
        name: Drift score
      - entity: input_select.varme_anlaegstype
        name: Anlaeg
    cards:
      - type: entities
        title: Driftstatus
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.varme_optimering_aktiv
            name: Overvaagning
          - entity: input_select.varme_anlaegstype
            name: Anlaegstype
          - entity: sensor.varme_varmekilde_status
            name: Varmekilde
          - entity: sensor.varme_status
            name: Aktuel status
          - entity: sensor.varme_alarm_arsag
            name: Alarmarsag
          - entity: sensor.varme_anbefaling
            name: Anbefaling

      - type: horizontal-stack
        cards:
          - type: gauge
            name: Drift score
            entity: sensor.varme_drift_score
            min: 0
            max: 100
            severity:
              red: 0
              yellow: 70
              green: 90

          - type: gauge
            name: Delta T
            entity: sensor.varme_delta_t
            min: 0
            max: 40
            severity:
              red: 0
              yellow: 8
              green: 12

      - type: entities
        title: Temperaturer
        state_color: true
        entities:
          - entity: sensor.varme_fremlob
            name: Fremlob
          - entity: sensor.varme_returlob
            name: Returlob
          - entity: sensor.varme_delta_t
            name: Delta T
          - entity: sensor.varme_ude_temperatur
            name: Udetemperatur
          - entity: sensor.varme_pumpe_effekt
            name: Pumpeeffekt

      - type: history-graph
        title: Temperaturhistorik 24 timer
        hours_to_show: 24
        entities:
          - entity: sensor.varme_fremlob
            name: Fremlob
          - entity: sensor.varme_returlob
            name: Returlob
          - entity: sensor.varme_delta_t
            name: Delta T
          - entity: sensor.varme_ude_temperatur
            name: Ude

      - type: entities
        title: Aktive alarmer og fejl
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.varme_alarm_aktiv
            name: Alarm aktiv
          - entity: binary_sensor.varme_sensorfejl
            name: Sensorfejl
          - entity: binary_sensor.varme_fremlob_for_lav
            name: Fremlob for lav
          - entity: binary_sensor.varme_fremlob_for_hoj
            name: Fremlob for hoj
          - entity: binary_sensor.varme_returlob_for_hoj
            name: Returlob for hoj
          - entity: binary_sensor.varme_delta_t_for_lav
            name: Delta T for lav
          - entity: binary_sensor.varme_delta_t_for_hoj
            name: Delta T for hoj
          - entity: binary_sensor.varme_frost_risiko
            name: Frost risiko

      - type: horizontal-stack
        cards:
          - type: button
            name: Kvitter
            icon: mdi:check-circle
            entity: input_boolean.varme_alarm_ack
            tap_action:
              action: call-service
              service: script.varme_alarm_kvitter
          - type: button
            name: Pause 2t
            icon: mdi:bell-off
            entity: input_boolean.varme_alarm_muted
            tap_action:
              action: call-service
              service: script.varme_alarm_pause_2h
          - type: button
            name: Reset
            icon: mdi:alert-remove
            entity: input_boolean.varme_alarm_latch
            tap_action:
              action: call-service
              service: script.varme_alarm_reset

      - type: entities
        title: Alarmhaandtering
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.varme_alarm_latch
            name: Alarm latch
          - entity: input_boolean.varme_alarm_ack
            name: Kvitteret
          - entity: input_boolean.varme_alarm_muted
            name: Alarm pa pause
          - entity: timer.varme_alarm_mute_2h
            name: Pause timer

  - title: Sensorer og Alarmer
    path: varme-sensorer
    icon: mdi:tune-variant
    type: masonry
    cards:
      - type: entities
        title: Sensorregistrering
        show_header_toggle: false
        entities:
          - entity: input_text.varme_fremlob_sensor
            name: Fremlob sensor entity
          - entity: input_text.varme_returlob_sensor
            name: Returlob sensor entity
          - entity: input_text.varme_ude_sensor
            name: Ude sensor entity
          - entity: input_text.varme_pumpe_power_sensor
            name: Pumpeeffekt sensor entity
          - entity: input_text.varme_varmekilde_status_sensor
            name: Varmekilde status entity

      - type: entities
        title: Temperaturgraenser
        show_header_toggle: false
        entities:
          - entity: input_number.varme_fremlob_min
            name: Min fremlob
          - entity: input_number.varme_fremlob_max
            name: Maks fremlob
          - entity: input_number.varme_returlob_max
            name: Maks returlob
          - entity: input_number.varme_delta_t_min
            name: Min delta T
          - entity: input_number.varme_delta_t_max
            name: Maks delta T
          - entity: input_number.varme_alarm_hysterese
            name: Hysterese
          - entity: input_number.varme_frost_graense
            name: Frostgraense

      - type: entities
        title: Notifikationer
        show_header_toggle: false
        entities:
          - entity: input_boolean.varme_notifikation_aktiv
            name: Notifikation aktiv
          - entity: input_text.varme_notify_service
            name: Notifikation service
          - entity: input_number.varme_alarm_repeat_min
            name: Gentag alarm hvert
          - entity: input_boolean.varme_sms_aktiv
            name: SMS aktiv
          - entity: input_text.varme_sms_service
            name: SMS service
          - entity: input_text.varme_sms_modtager
            name: SMS modtager

      - type: entities
        title: Driftvalg
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_boolean.varme_optimering_aktiv
            name: Varmeoptimering aktiv
          - entity: input_boolean.varme_frostsikring_aktiv
            name: Frostsikring aktiv
          - entity: input_select.varme_anlaegstype
            name: Anlaegstype
          - entity: input_select.varme_statistik_periode
            name: Standard statistikperiode

      - type: entities
        title: Systemkontrol
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.varme_status
            name: Status
          - entity: sensor.varme_alarm_arsag
            name: Alarmarsag
          - entity: sensor.varme_anbefaling
            name: Anbefaling
          - entity: binary_sensor.varme_sensorfejl
            name: Sensorfejl
          - entity: sensor.varme_varmekilde_status
            name: Varmekilde status

      - type: markdown
        title: Opsaetning
        content: >
          Udfyld sensorfelterne med Home Assistant entity_id'er. Brug fx
          sensor.kedel_fremlob, sensor.kedel_returlob og sensor.ude_temperatur.
          SMS kraever en eksisterende notify- eller SMS-service i Home Assistant.

  - title: Statistik
    path: varme-statistik
    icon: mdi:chart-line
    type: masonry
    cards:
      - type: entities
        title: Statistikvalg
        show_header_toggle: false
        entities:
          - entity: input_select.varme_statistik_periode
            name: Valgt periode
          - entity: sensor.varme_drift_score
            name: Aktuel drift score
          - entity: sensor.varme_status
            name: Aktuel status
          - entity: sensor.varme_alarm_arsag
            name: Seneste alarmarsag

      - type: statistics-graph
        title: Temperaturer 7 dage
        days_to_show: 7
        chart_type: line
        stat_types:
          - mean
          - min
          - max
        entities:
          - sensor.varme_fremlob
          - sensor.varme_returlob
          - sensor.varme_ude_temperatur

      - type: statistics-graph
        title: Delta T 7 dage
        days_to_show: 7
        chart_type: line
        stat_types:
          - mean
          - min
          - max
        entities:
          - sensor.varme_delta_t

      - type: statistics-graph
        title: Drift score 7 dage
        days_to_show: 7
        chart_type: line
        stat_types:
          - mean
          - min
          - max
        entities:
          - sensor.varme_drift_score

      - type: history-graph
        title: Alarmhistorik 7 dage
        hours_to_show: 168
        entities:
          - entity: binary_sensor.varme_alarm_aktiv
            name: Alarm
          - entity: binary_sensor.varme_sensorfejl
            name: Sensorfejl
          - entity: binary_sensor.varme_delta_t_for_lav
            name: Lav delta T
          - entity: binary_sensor.varme_returlob_for_hoj
            name: Hoj returlob
          - entity: binary_sensor.varme_frost_risiko
            name: Frost risiko

      - type: history-graph
        title: Effekt og temperatur 24 timer
        hours_to_show: 24
        entities:
          - entity: sensor.varme_pumpe_effekt
            name: Pumpeeffekt
          - entity: sensor.varme_fremlob
            name: Fremlob
          - entity: sensor.varme_returlob
            name: Returlob

      - type: entities
        title: Noegletal
        state_color: true
        entities:
          - entity: sensor.varme_fremlob
            name: Aktuel fremlob
          - entity: sensor.varme_returlob
            name: Aktuel returlob
          - entity: sensor.varme_delta_t
            name: Aktuel delta T
          - entity: sensor.varme_ude_temperatur
            name: Aktuel udetemperatur
          - entity: sensor.varme_pumpe_effekt
            name: Aktuel pumpeeffekt
          - entity: binary_sensor.varme_alarm_aktiv
            name: Alarm aktiv
